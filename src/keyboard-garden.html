<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
    <title>键盘花园 - 番茄钟</title>
    <link rel="stylesheet" href="styles/keyboard-garden.css">
</head>
<body>
    <div class="garden-shell">
        <!-- 装饰背景层（绝对定位，z:1） -->
        <div class="garden-decor">
            <div class="decor-sun"></div>
            <div class="decor-cloud c1"></div>
            <div class="decor-cloud c2"></div>
            <div class="decor-cloud c3"></div>

            <!-- 远景树（多个） -->
            <div class="decor-tree t1"></div>
            <div class="decor-tree t2"></div>
            <div class="decor-tree t3"></div>
            <div class="decor-tree t4"></div>

            <!-- 小木屋（含窗户、门） -->
            <div class="decor-house">
                <div class="decor-house-window"></div>
                <div class="decor-house-door"></div>
            </div>

            <!-- 稻草人（含帽子） -->
            <div class="decor-scarecrow">
                <div class="decor-scarecrow-hat"></div>
            </div>

            <!-- 邮箱（含旗） -->
            <div class="decor-mailbox">
                <div class="decor-mailbox-flag"></div>
            </div>

            <!-- 前景栅栏（z:50） -->
            <div class="decor-fence"></div>
        </div>

        <!-- 动物层（z:20） -->
        <div class="garden-animals">
            <div class="garden-animal elephant" data-name="elephant">🐘</div>
            <div class="garden-animal sheep"     data-name="sheep">🐑</div>
            <div class="garden-animal pig-1"     data-name="pig">🐖</div>
            <div class="garden-animal pig-2"     data-name="pig">🐖</div>
            <div class="garden-animal rabbit"    data-name="rabbit">🐰</div>
            <div class="garden-animal bear"      data-name="bear">🐻</div>
            <div class="garden-animal chicken"   data-name="chicken">🐔</div>
            <div class="garden-animal bird-1"    data-name="bird">🐦</div>
            <div class="garden-animal bird-2"    data-name="bird">🐤</div>
        </div>

        <!-- 标题栏 -->
        <header class="garden-titlebar">
            <div class="garden-brand">
                <div class="garden-brand-mark">🌿</div>
                <div>
                    <div class="garden-brand-title">键盘花园</div>
                    <div class="garden-brand-subtitle">每个键位种一株，按键越多越丰收</div>
                </div>
            </div>
            <div class="garden-title-actions">
                <button class="garden-icon-btn" id="gardenBtnStats"  title="查看统计">📊</button>
                <button class="garden-icon-btn" id="gardenBtnRefresh" title="刷新">↻</button>
                <button class="garden-icon-btn danger" id="gardenBtnClose" title="关闭">✕</button>
            </div>
        </header>

        <!-- 顶部状态条 -->
        <section class="garden-stats-bar" id="gardenStatsBar">
            <div class="garden-stat hero">
                <span class="garden-stat-icon">🪙</span>
                <strong id="gardenCoins">0</strong>
                <span class="garden-stat-label">金币</span>
            </div>
            <div class="garden-stat">
                <span class="garden-stat-icon">🌾</span>
                <strong id="gardenHarvests">0</strong>
                <span class="garden-stat-label">总收获</span>
            </div>
            <div class="garden-stat">
                <span class="garden-stat-icon">⌨️</span>
                <strong id="gardenTotalKeys">0</strong>
                <span class="garden-stat-label">总敲击</span>
            </div>
            <div class="garden-stat">
                <span class="garden-stat-icon">🏅</span>
                <strong id="gardenLevel">Lv.1</strong>
                <span class="garden-stat-label">温室等级</span>
            </div>
            <div class="garden-stat">
                <span class="garden-stat-icon">⏱️</span>
                <strong id="gardenLastHarvest">暂无</strong>
                <span class="garden-stat-label">上次丰收</span>
            </div>
        </section>

        <!-- 横幅 -->
        <div class="garden-banner" id="gardenBanner">按下任意键，让苗开始长。</div>

        <!-- 主键盘区 -->
        <main class="garden-main">
            <div class="garden-board" id="gardenBoard"></div>
        </main>

        <!-- 浮层：详细统计（默认隐藏） -->
        <aside class="garden-side-panel" id="gardenSidePanel" hidden>
            <header class="garden-side-header">
                <h3>📊 详细统计</h3>
                <button class="garden-icon-btn" id="gardenSideClose" title="关闭">✕</button>
            </header>
            <section class="garden-side-section">
                <div class="garden-section-title">🏆 丰收排行</div>
                <div class="garden-ranking" id="gardenRanking"></div>
            </section>
            <section class="garden-side-section">
                <div class="garden-section-title">📢 最近动态</div>
                <div class="garden-feed" id="gardenFeed"></div>
            </section>
        </aside>
    </div>

    <script src="js/utils/date-utils.js"></script>
    <script src="js/utils/dom-utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/focus-activity.js"></script>
    <script src="js/keyboard-garden.js"></script>
</body>
</html>
